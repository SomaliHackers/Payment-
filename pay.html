<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جاري فتح الاتصال...</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #1e3a8a, #312e81);
    font-family: Arial, sans-serif; color: #fff; padding: 20px;
  }
  .card {
    width: min(92%, 420px); padding: 30px 24px; text-align: center;
    background: rgba(255,255,255,0.08); border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  h1 { margin: 0 0 14px; font-size: 22px; }
  p { line-height: 1.8; color: #cbd5e1; font-size: 15px; }
  .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #fbbf24;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 16px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .code {
    direction: ltr; display: inline-block; margin: 14px 0;
    padding: 12px 16px; border-radius: 12px;
    background: rgba(0,0,0,0.35);
    font-size: 20px; font-weight: bold; letter-spacing: 1px;
    color: #fbbf24;
  }
  .pay-btn {
    display: block; width: 100%; padding: 16px; margin-top: 14px;
    border: 0; border-radius: 12px;
    background: #22c55e; color: #fff;
    font-size: 18px; font-weight: bold;
    text-decoration: none; cursor: pointer;
    font-family: inherit;
  }
  .copy-btn {
    display: block; width: 100%; padding: 12px; margin-top: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    background: transparent; color: #cbd5e1;
    font-size: 15px; cursor: pointer;
    font-family: inherit;
  }
  .note { margin-top: 14px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <main class="card">
    <h1>⏳ جاري فتح لوحة الاتصال...</h1>
    <div class="spinner"></div>
    <p>إذا لم تُفتح تلقائيًا خلال ثانيتين، اضغط الزر الأخضر:</p>
    <div class="code">*220*8110374*30000#</div>
    <a class="pay-btn" href="#" onclick="openDialer(); return false;">📞 افتح لوحة الاتصال</a>
    <button class="copy-btn" onclick="copyCode()">📋 أو انسخ الرمز</button>
    <p class="note">قد يطلب منك الهاتف اختيار شريحة الاتصال.</p>
  </main>

  <script>
    var USSD = '*220*8110374*30000#';
    var USSD_ENC = '*220*8110374*30000%23';

    function openDialer() {
      try {
        var intent = 'intent://' + USSD_ENC +
                     '#Intent;scheme=tel;action=android.intent.action.DIAL;end';
        window.location.href = intent;
      } catch(e) {}
      setTimeout(function() {
        try { window.location.href = 'tel://' + USSD_ENC; } catch(e) {}
      }, 400);
      setTimeout(function() {
        try { window.location.href = 'tel:' + USSD; } catch(e) {}
      }, 800);
    }

    function copyCode() {
      navigator.clipboard.writeText(USSD).then(function() {
        alert('✅ تم نسخ الرمز: ' + USSD);
      }, function() {
        alert('الرمز: ' + USSD);
      });
    }

    // فتح تلقائي بعد تحميل الصفحة
    window.addEventListener('load', function () {
      setTimeout(openDialer, 300);
    });
  </script>
</body>
</html>
